# Sistema de Notas: base de datos, API y frontend con un solo comando.
# Uso:  docker compose up -d --build
# Frontend: http://localhost:4200 · API y Swagger: http://localhost:5080/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestionnotas-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Prueba123*"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Prueba123*' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ejecuta el script de la base de datos cuando SQL Server está listo, y termina.
  sqlinit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Prueba123*" -C -i /scripts/script.sql

  api:
    build: ./backend
    container_name: gestionnotas-api
    depends_on:
      sqlinit:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # habilita Swagger para la revisión de la prueba
      ConnectionStrings__GestionNotas: "Server=sqlserver,1433;Database=GestionNotas;User Id=sa;Password=Prueba123*;TrustServerCertificate=True"
      Cors__Origenes__0: "http://localhost:4200"
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    container_name: gestionnotas-web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sqldata:
